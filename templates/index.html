<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ metadata.description }}">
    <meta name="author" content="Edgardo Paz-Romero">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0a192f">

    <link rel="canonical" href="{{ canonical_url }}">
    <link rel="icon" type="image/png" href="/static/images/logo-tab.png">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="Edgardo Paz-Romero Portfolio">
    <meta property="og:title" content="{{ metadata.title }}">
    <meta property="og:description" content="{{ metadata.description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:image" content="{{ profile_image_url }}">
    <meta property="og:image:alt" content="Edgardo Paz-Romero">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ metadata.title }}">
    <meta name="twitter:description" content="{{ metadata.description }}">
    <meta name="twitter:image" content="{{ profile_image_url }}">

    <script type="application/ld+json">{{ structured_data | tojson }}</script>
    <title>{{ metadata.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <a class="skip-link" href="#root">Skip to main content</a>
    <div class="noise-overlay" aria-hidden="true"></div>
    <header>
        <div class="nav-container">
            <a href="/" class="logo" aria-label="Home">
                <img src="/static/images/white-temple-logo.png" alt="" />
            </a>
            <nav aria-label="Primary navigation">
                <ul class="desktop-nav">
                    <li><a href="/" data-section="home"><span>01.</span> Home</a></li>
                    <li><a href="/about-me" data-section="about"><span>02.</span> About</a></li>
                    <li><a href="/projects" data-section="projects"><span>03.</span> Projects</a></li>
                    <li><a class="resume-link" href="/static/images/Edgardo_Paz_Romero_Resume.pdf" target="_blank" rel="noopener noreferrer" aria-label="Resume PDF (opens in a new tab)">Resume</a></li>
                </ul>
                <details class="mobile-nav">
                    <summary aria-label="Navigation menu">
                        <span class="mobile-nav-icon" aria-hidden="true"></span>
                        <span class="mobile-nav-icon" aria-hidden="true"></span>
                        <span class="mobile-nav-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Menu</span>
                    </summary>
                    <ul class="mobile-nav-list">
                        <li><a href="/" data-section="home"><span>01.</span> Home</a></li>
                        <li><a href="/about-me" data-section="about"><span>02.</span> About</a></li>
                        <li><a href="/projects" data-section="projects"><span>03.</span> Projects</a></li>
                        <li><a class="resume-link" href="/static/images/Edgardo_Paz_Romero_Resume.pdf" target="_blank" rel="noopener noreferrer" aria-label="Resume PDF (opens in a new tab)">Resume</a></li>
                    </ul>
                </details>
            </nav>
        </div>
    </header>

    <main id="root" tabindex="-1">{% include "_portfolio.html" %}</main>

    <script>
        window.initialSection = "{{ initial_section or '' }}";
    </script>
    <script defer src="{{ url_for('static', filename='dist/app.js') }}"></script>
</body>
</html>
